source:      .
destination: ./_site

# GitHub Pages user site (ds257.github.io) -> baseurl must be empty.
# If you ever move this to a project repo, set: baseurl: /repo-name
baseurl: ""
url: "https://ds257.github.io"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      # Scoped to posts only (not the global `permalink:` key) so it
      # doesn't also rewrite blog.html and other pages into folder/index.html.
      permalink: "/blog/:title/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
