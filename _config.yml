source:      .
destination: ./_site

# GitHub Pages user site (ds257.github.io) -> baseurl must be empty.
# If you ever move this to a project repo, set: baseurl: /repo-name
baseurl: ""
url: "https://ds257.github.io"

permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
